name: Deploy Perspective

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sketch.js'
      - 'js/**'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'icons/**'
      - 'vendor/**'
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit containing the validated observations
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: perspective-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check the app and data-processing scripts
        run: |
          node tests/climate.test.cjs
          node tests/pwa.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Prepare the static website
        run: |
          mkdir _site
          cp index.html sketch.js styles.css manifest.webmanifest service-worker.js _site/
          cp -R js _site/js
          cp -R data _site/data
          cp -R icons _site/icons
          cp -R vendor _site/vendor

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
