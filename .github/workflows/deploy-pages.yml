name: Deploy Perspective

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sketch.js'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit containing the validated observations
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: perspective-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Prepare the static website
        run: |
          mkdir _site
          cp index.html sketch.js _site/
          cp -R data _site/data

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
